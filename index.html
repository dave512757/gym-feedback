<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym Machine Feedback System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root {
    --black: #0a0a0a;
    --charcoal: #1a1a1a;
    --steel: #2a2a2a;
    --iron: #3d3d3d;
    --silver: #8a8a8a;
    --light: #e8e8e8;
    --white: #f5f5f5;
    --orange: #ff5c1a;
    --orange-dim: rgba(255,92,26,0.12);
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #f59e0b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--black);
    color: var(--white);
    min-height: 100vh;
  }

  /* ── VIEWS ── */
  .view { display: none; }
  .view.active { display: block; }

  /* ══════════════════════════
     ADMIN VIEW
  ══════════════════════════ */
  #admin-view {
    max-width: 960px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  .admin-header {
    display: flex;
    align-items: flex-end;
    gap: 16px;
    margin-bottom: 48px;
    border-bottom: 1px solid var(--steel);
    padding-bottom: 32px;
  }

  .logo-mark {
    width: 52px; height: 52px;
    background: var(--orange);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px; color: #000; flex-shrink: 0;
  }

  .admin-header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(28px, 5vw, 44px);
    letter-spacing: 2px;
    line-height: 1;
  }

  .admin-header h1 span { color: var(--orange); }

  .admin-header p {
    font-size: 13px;
    color: var(--silver);
    margin-top: 4px;
  }

  /* Add machine form */
  .add-machine-card {
    background: var(--charcoal);
    border: 1px solid var(--steel);
    border-radius: 12px;
    padding: 28px;
    margin-bottom: 40px;
  }

  .section-label {
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 3px;
    font-size: 13px;
    color: var(--orange);
    margin-bottom: 16px;
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 12px;
    align-items: end;
  }

  @media (max-width: 600px) {
    .form-row { grid-template-columns: 1fr; }
  }

  .field label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--silver);
    margin-bottom: 8px;
  }

  .field input, .field select {
    width: 100%;
    background: var(--steel);
    border: 1px solid var(--iron);
    border-radius: 8px;
    padding: 12px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--white);
    outline: none;
    transition: border-color 0.2s;
  }

  .field input:focus, .field select:focus {
    border-color: var(--orange);
  }

  .field select option { background: var(--charcoal); }

  .btn {
    padding: 12px 22px;
    border: none;
    border-radius: 8px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    letter-spacing: 1.5px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .btn-primary {
    background: var(--orange);
    color: #000;
  }

  .btn-primary:hover { background: #ff7a45; transform: translateY(-1px); }

  .btn-ghost {
    background: transparent;
    color: var(--silver);
    border: 1px solid var(--iron);
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    padding: 8px 14px;
  }

  .btn-ghost:hover { border-color: var(--orange); color: var(--orange); }

  /* Machine grid */
  .machines-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }

  .machine-card {
    background: var(--charcoal);
    border: 1px solid var(--steel);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.2s;
    animation: slideIn 0.35s ease both;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .machine-card:hover { border-color: var(--orange); transform: translateY(-2px); }

  .machine-card-header {
    padding: 20px 20px 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .machine-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 1px;
    line-height: 1.1;
  }

  .machine-zone {
    font-size: 11px;
    color: var(--silver);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 3px;
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-top: 6px;
    flex-shrink: 0;
  }

  .status-dot.ok   { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .status-dot.warn { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
  .status-dot.bad  { background: var(--red); box-shadow: 0 0 6px var(--red); }

  .qr-wrapper {
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .qr-box {
    background: #fff;
    padding: 6px;
    border-radius: 6px;
    flex-shrink: 0;
  }

  .machine-stats {
    font-size: 12px;
    color: var(--silver);
    line-height: 1.8;
  }

  .machine-stats strong {
    color: var(--white);
    font-weight: 600;
  }

  .vote-bar-wrap {
    padding: 0 20px 8px;
  }

  .vote-bar-label {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--silver);
    margin-bottom: 6px;
  }

  .vote-bar {
    height: 4px;
    background: var(--steel);
    border-radius: 999px;
    overflow: hidden;
  }

  .vote-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--orange), #ff8c5a);
    border-radius: 999px;
    transition: width 0.6s ease;
  }

  .machine-card-footer {
    padding: 12px 20px 16px;
    display: flex;
    gap: 8px;
    border-top: 1px solid var(--steel);
  }

  .tag {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    font-weight: 500;
  }

  .tag-keep { background: rgba(34,197,94,0.15); color: var(--green); }
  .tag-replace { background: rgba(239,68,68,0.15); color: var(--red); }
  .tag-maintenance { background: rgba(245,158,11,0.15); color: var(--yellow); }

  .btn-del {
    margin-left: auto;
    background: transparent;
    border: none;
    color: var(--iron);
    cursor: pointer;
    font-size: 16px;
    padding: 2px 4px;
    transition: color 0.2s;
  }

  .btn-del:hover { color: var(--red); }

  .empty-state {
    grid-column: 1/-1;
    text-align: center;
    padding: 60px 20px;
    color: var(--silver);
  }

  .empty-state .big { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  /* ══════════════════════════
     MEMBER VIEW
  ══════════════════════════ */
  #member-view {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px 60px;
    position: relative;
  }

  #member-view::before {
    content: '';
    position: fixed; inset: 0;
    background: radial-gradient(ellipse 70% 60% at 50% 0%, rgba(255,92,26,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .member-card {
    width: 100%;
    max-width: 440px;
    animation: cardIn 0.5s cubic-bezier(.22,1,.36,1) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .member-machine-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 38px;
    letter-spacing: 2px;
    line-height: 1;
    margin-bottom: 4px;
  }

  .member-machine-zone {
    font-size: 12px;
    color: var(--silver);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 28px;
  }

  .section-block {
    background: var(--charcoal);
    border: 1px solid var(--steel);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 16px;
  }

  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 2px;
    font-size: 15px;
    color: var(--orange);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Keep/Remove vote buttons */
  .vote-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .vote-btn {
    border: 2px solid transparent;
    border-radius: 10px;
    padding: 18px 12px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
    text-align: center;
    background: var(--steel);
    color: var(--white);
  }

  .vote-btn .icon { font-size: 28px; display: block; margin-bottom: 6px; }

  .vote-btn:hover { transform: translateY(-2px); }

  .vote-btn.keep:hover, .vote-btn.keep.selected {
    background: rgba(34,197,94,0.15);
    border-color: var(--green);
    color: var(--green);
  }

  .vote-btn.remove:hover, .vote-btn.remove.selected {
    background: rgba(239,68,68,0.15);
    border-color: var(--red);
    color: var(--red);
  }

  /* Maintenance issues */
  .issue-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .issue-chip {
    border: 1.5px solid var(--iron);
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    background: var(--steel);
    color: var(--silver);
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .issue-chip:hover { border-color: var(--yellow); color: var(--white); }

  .issue-chip.selected {
    background: rgba(245,158,11,0.12);
    border-color: var(--yellow);
    color: var(--yellow);
  }

  .issue-chip span { font-size: 16px; }

  .comment-field {
    margin-top: 12px;
  }

  .comment-field textarea {
    width: 100%;
    background: var(--steel);
    border: 1.5px solid var(--iron);
    border-radius: 8px;
    padding: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--white);
    outline: none;
    resize: none;
    height: 90px;
    transition: border-color 0.2s;
  }

  .comment-field textarea:focus { border-color: var(--orange); }
  .comment-field textarea::placeholder { color: var(--iron); }

  .submit-btn {
    width: 100%;
    padding: 18px;
    background: var(--orange);
    color: #000;
    border: none;
    border-radius: 12px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
  }

  .submit-btn:hover { background: #ff7a45; transform: translateY(-2px); }
  .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* Thank you state */
  .thankyou {
    text-align: center;
    padding: 40px 0;
    animation: cardIn 0.5s cubic-bezier(.22,1,.36,1) both;
  }

  .thankyou .big-icon { font-size: 64px; margin-bottom: 16px; }

  .thankyou h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }

  .thankyou p { color: var(--silver); font-size: 14px; }

  /* Print modal */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--charcoal);
    border: 1px solid var(--steel);
    border-radius: 16px;
    padding: 32px;
    max-width: 400px;
    width: 100%;
    text-align: center;
  }

  .modal h3 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }

  .modal p { font-size: 13px; color: var(--silver); margin-bottom: 24px; }

  .modal-qr {
    background: #fff;
    display: inline-block;
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 20px;
  }

  .modal-buttons { display: flex; gap: 10px; justify-content: center; }

  @media print {
    body * { visibility: hidden; }
    .print-area, .print-area * { visibility: visible; }
    .print-area {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
  }
</style>
</head>
<body>

<!-- ══ ADMIN VIEW ══ -->
<div id="admin-view" class="view active">
  <div class="admin-header">
    <div class="logo-mark">GF</div>
    <div>
      <h1>MACHINE <span>MANAGER</span></h1>
      <p>Generate QR codes · Track votes · Monitor maintenance</p>
    </div>
  </div>

  <div class="add-machine-card">
    <div class="section-label">▸ ADD NEW MACHINE</div>
    <div class="form-row">
      <div class="field">
        <label>Machine Name</label>
        <input type="text" id="machine-name-input" placeholder="e.g. Cable Crossover">
      </div>
      <div class="field">
        <label>Zone / Location</label>
        <input type="text" id="machine-zone-input" placeholder="e.g. Free Weights Area">
      </div>
      <button class="btn btn-primary" onclick="addMachine()">+ ADD</button>
    </div>
  </div>

  <div class="section-label" style="margin-bottom:16px">▸ YOUR MACHINES</div>
  <div class="machines-grid" id="machines-grid">
    <!-- cards injected here -->
  </div>
</div>

<!-- ══ MEMBER VIEW ══ -->
<div id="member-view" class="view">
  <div class="member-card" id="member-card-content">
    <!-- injected dynamically -->
  </div>
</div>

<!-- ══ PRINT MODAL ══ -->
<div class="modal-overlay" id="print-modal">
  <div class="modal">
    <h3>PRINT QR CODE</h3>
    <p id="modal-machine-name" style="color:var(--orange);font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;margin-bottom:4px;"></p>
    <p>Scan to access the feedback form for this machine</p>
    <div class="modal-qr print-area">
      <div id="modal-qr-display"></div>
    </div>
    <div class="modal-buttons">
      <button class="btn btn-ghost" onclick="closeModal()">Close</button>
      <button class="btn btn-primary" onclick="window.print()">🖨 Print</button>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────
let machines = JSON.parse(localStorage.getItem('gym_machines') || '[]');
let currentMachineId = null;

const ISSUES = [
  { id: 'cable', label: 'Cable/Strap', icon: '🔗' },
  { id: 'padding', label: 'Padding worn', icon: '🪑' },
  { id: 'noise', label: 'Loud/Squeaking', icon: '🔊' },
  { id: 'weight', label: 'Weight stack', icon: '⚖️' },
  { id: 'adjustment', label: 'Seat adjust', icon: '🔧' },
  { id: 'safety', label: 'Safety issue', icon: '⚠️' },
];

function save() { localStorage.setItem('gym_machines', JSON.stringify(machines)); }

// ─────────────────────────────────────────
//  ROUTING  (check URL param)
// ─────────────────────────────────────────
function init() {
  const params = new URLSearchParams(location.search);
  const mid = params.get('machine');
  if (mid) {
    showMemberView(mid);
  } else {
    showAdminView();
  }
}

function showAdminView() {
  document.getElementById('admin-view').classList.add('active');
  document.getElementById('member-view').classList.remove('active');
  renderMachines();
}

function showMemberView(machineId) {
  document.getElementById('admin-view').classList.remove('active');
  document.getElementById('member-view').classList.add('active');
  currentMachineId = machineId;
  renderMemberForm(machineId);
}

// ─────────────────────────────────────────
//  ADMIN
// ─────────────────────────────────────────
function addMachine() {
  const name = document.getElementById('machine-name-input').value.trim();
  const zone = document.getElementById('machine-zone-input').value.trim();
  if (!name) { alert('Please enter a machine name'); return; }

  const machine = {
    id: 'M' + Date.now(),
    name,
    zone: zone || 'General Floor',
    votes: { keep: 0, remove: 0 },
    maintenance: [],
    createdAt: Date.now()
  };
  machines.unshift(machine);
  save();
  renderMachines();

  document.getElementById('machine-name-input').value = '';
  document.getElementById('machine-zone-input').value = '';
}

function deleteMachine(id) {
  if (!confirm('Remove this machine?')) return;
  machines = machines.filter(m => m.id !== id);
  save();
  renderMachines();
}

function renderMachines() {
  const grid = document.getElementById('machines-grid');

  if (machines.length === 0) {
    grid.innerHTML = `<div class="empty-state">
      <div class="big">🏋️</div>
      <p>No machines yet. Add your first machine above.</p>
    </div>`;
    return;
  }

  grid.innerHTML = machines.map(m => {
    const total = m.votes.keep + m.votes.remove;
    const keepPct = total > 0 ? Math.round((m.votes.keep / total) * 100) : 0;
    const mainCount = m.maintenance ? m.maintenance.length : 0;

    let statusClass = 'ok';
    if (mainCount > 0) statusClass = mainCount >= 3 ? 'bad' : 'warn';

    const memberUrl = `https://shiny-naiad-2745ab.netlify.app?machine=${m.id}`;

    let keepTag = '';
    if (total >= 3) {
      if (keepPct >= 60) keepTag = `<span class="tag tag-keep">✓ Keep</span>`;
      else if (keepPct <= 40) keepTag = `<span class="tag tag-replace">✗ Replace</span>`;
    }

    return `<div class="machine-card" id="card-${m.id}">
      <div class="machine-card-header">
        <div>
          <div class="machine-name">${m.name}</div>
          <div class="machine-zone">${m.zone}</div>
        </div>
        <div class="status-dot ${statusClass}"></div>
      </div>

      <div class="qr-wrapper">
        <div class="qr-box" id="qr-${m.id}"></div>
        <div class="machine-stats">
          <div>Votes: <strong>${total}</strong></div>
          <div>Keep: <strong>${m.votes.keep}</strong> · Remove: <strong>${m.votes.remove}</strong></div>
          <div>Maintenance reports: <strong>${mainCount}</strong></div>
        </div>
      </div>

      <div class="vote-bar-wrap">
        <div class="vote-bar-label">
          <span>Keep ${keepPct}%</span>
          <span>Remove ${100 - keepPct}%</span>
        </div>
        <div class="vote-bar">
          <div class="vote-bar-fill" style="width:${keepPct}%"></div>
        </div>
      </div>

      <div class="machine-card-footer">
        ${keepTag}
        ${mainCount > 0 ? `<span class="tag tag-maintenance">⚠ ${mainCount} issue${mainCount>1?'s':''}</span>` : ''}
        <button class="btn btn-ghost" onclick="openPrintModal('${m.id}')" style="margin-left:auto">🖨 QR</button>
        <button class="btn-del" onclick="deleteMachine('${m.id}')" title="Delete">✕</button>
      </div>
    </div>`;
  }).join('');

  // Render tiny QR codes
  machines.forEach(m => {
    const el = document.getElementById(`qr-${m.id}`);
    if (!el || el.querySelector('canvas')) return;
    const url = `https://shiny-naiad-2745ab.netlify.app?machine=${m.id}`;
    new QRCode(el, { text: url, width: 72, height: 72, colorDark: '#000', colorLight: '#fff', correctLevel: QRCode.CorrectLevel.M });
  });
}

// ─────────────────────────────────────────
//  PRINT MODAL
// ─────────────────────────────────────────
function openPrintModal(machineId) {
  const m = machines.find(x => x.id === machineId);
  if (!m) return;
  document.getElementById('modal-machine-name').textContent = m.name;
  const container = document.getElementById('modal-qr-display');
  container.innerHTML = '';
  const url = `https://shiny-naiad-2745ab.netlify.app?machine=${machineId}`;
  new QRCode(container, { text: url, width: 200, height: 200, colorDark: '#000', colorLight: '#fff', correctLevel: QRCode.CorrectLevel.M });
  document.getElementById('print-modal').classList.add('open');
}

function closeModal() {
  document.getElementById('print-modal').classList.remove('open');
}

// ─────────────────────────────────────────
//  MEMBER FORM
// ─────────────────────────────────────────
function renderMemberForm(machineId) {
  const m = machines.find(x => x.id === machineId);
  const container = document.getElementById('member-card-content');

  if (!m) {
    container.innerHTML = `<div style="text-align:center;padding:60px 0">
      <div style="font-size:48px;margin-bottom:16px">🔍</div>
      <div style="font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px">Machine Not Found</div>
      <p style="color:var(--silver);margin-top:8px;font-size:13px">This QR code may be outdated.</p>
    </div>`;
    return;
  }

  container.innerHTML = `
    <div class="member-machine-title">${m.name}</div>
    <div class="member-machine-zone">${m.zone}</div>

    <div class="section-block">
      <div class="section-title">💪 Should we keep this machine?</div>
      <div class="vote-buttons">
        <button class="vote-btn keep" onclick="selectVote('keep', this)">
          <span class="icon">👍</span>
          Keep it!
        </button>
        <button class="vote-btn remove" onclick="selectVote('remove', this)">
          <span class="icon">👎</span>
          Replace it
        </button>
      </div>
    </div>

    <div class="section-block">
      <div class="section-title">🔧 Any maintenance issues?</div>
      <div class="issue-grid" id="issue-grid">
        ${ISSUES.map(i => `<button class="issue-chip" data-id="${i.id}" onclick="toggleIssue(this)">
          <span>${i.icon}</span>${i.label}
        </button>`).join('')}
      </div>
      <div class="comment-field">
        <textarea id="member-comment" placeholder="Optional: describe the issue in more detail…"></textarea>
      </div>
    </div>

    <button class="submit-btn" id="submit-btn" onclick="submitFeedback('${machineId}')">
      SUBMIT FEEDBACK
    </button>
  `;
}

let selectedVote = null;
let selectedIssues = new Set();

function selectVote(type, btn) {
  selectedVote = type;
  document.querySelectorAll('.vote-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

function toggleIssue(btn) {
  const id = btn.dataset.id;
  if (selectedIssues.has(id)) {
    selectedIssues.delete(id);
    btn.classList.remove('selected');
  } else {
    selectedIssues.add(id);
    btn.classList.add('selected');
  }
}

function submitFeedback(machineId) {
  if (!selectedVote && selectedIssues.size === 0) {
    alert('Please vote or select at least one issue before submitting.');
    return;
  }

  const m = machines.find(x => x.id === machineId);
  if (!m) return;

  if (selectedVote) m.votes[selectedVote]++;

  if (selectedIssues.size > 0) {
    if (!m.maintenance) m.maintenance = [];
    m.maintenance.push({
      issues: [...selectedIssues],
      comment: document.getElementById('member-comment').value.trim(),
      ts: Date.now()
    });
  }

  save();

  // Show thank you
  const container = document.getElementById('member-card-content');
  container.innerHTML = `<div class="thankyou">
    <div class="big-icon">🙌</div>
    <h2>THANKS!</h2>
    <p>Your feedback helps us keep the gym in top shape.</p>
    <p style="margin-top:6px;font-size:12px;color:var(--iron)">You can close this page now.</p>
  </div>`;

  selectedVote = null;
  selectedIssues = new Set();
}

// ─────────────────────────────────────────
//  BOOT
// ─────────────────────────────────────────
init();
</script>
</body>
</html>
